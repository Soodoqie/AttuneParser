name: Test & Publish Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install test dependencies
        run: python -m pip install --upgrade pip && pip install lupa

      - name: Run static and standalone Lupa tests
        run: |
          python tests/test_static.py
          python tests/test_hardmode_tracks.py

      - name: Package AttuneParser addon zip
        run: |
          TAG="${GITHUB_REF_NAME}"
          mkdir -p "dist/AttuneParser"
          cp AttuneParser.toc AttuneParser.lua AttuneParser_Data.lua AttuneParser_Data2.lua AttuneParser_UI.lua AttuneParser_Integrations.lua "dist/AttuneParser/"
          (cd dist && zip -r "AttuneParser-${TAG}.zip" AttuneParser)

      - name: Upload asset to GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${GITHUB_REF_NAME}"
          ZIP_FILE="dist/AttuneParser-${TAG}.zip"
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" --title "AttuneParser $TAG" --generate-notes
          fi
          gh release upload "$TAG" "$ZIP_FILE" --clobber
